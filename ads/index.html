, "cat": "뷰티/에스테틱"}, {"dev": "모바일", "slot": "홈피드3", "date": "2026-09-03", "wd": "목", "h": "21", "o": 1260, "p": "img/2026-09-03_모바일_홈피드3_21.jpg", "adv": "비아지오(VIAGGIO)", "note": "전기자전거 신청만 하면 70만원 보조금 + 사은품까지", "cat": "모빌리티"}, {"dev": "모바일", "slot": "홈피드4", "date": "2026-09-03", "wd": "목", "h": "21", "o": 1260, "p": "img/2026-09-03_모바일_홈피드4_21.jpg", "adv": "더파인프리미엄", "note": "소나무 이렇게 먹었더니 당화혈 4주만에 뚝뚝 떨어져요", "cat": "건강/건기식"}]};

const HOURS = ["00", "09", "12", "15", "18", "21"];   // 고정 칼럼 (하루 6회차)
const dates = [...new Set(DATA.images.map(x => x.date))].sort().reverse();
let curDate = dates[0] || null;
let curDev = "전체";
let visible = [];   // 현재 화면 이미지 목록(라이트박스 순회용)
let lbIdx = -1;

const $ = id => document.getElementById(id);
const dateSel = $("dateSel");

// "16" → "오후 4시" (정시 통일 표기)
function hourLabel(h) {
  const n = parseInt(h, 10);
  if (n === 0) return "자정 12시";
  if (n < 12) return `오전 ${n}시`;
  if (n === 12) return "낮 12시";
  return `오후 ${n - 12}시`;
}

function typeChip(t) {
  if (!t) return "";
  const cls = t.startsWith("성과형") ? "tp-p" : t.startsWith("보장형") ? "tp-b" : "tp-e";
  return `<span class="type ${cls}">${t}</span>`;
}

function init() {
  const hm = location.hash.match(/\d{4}-\d{2}-\d{2}/);
  if (hm && dates.includes(hm[0])) curDate = hm[0];
  for (const d of dates) {
    const img = DATA.images.find(x => x.date === d);
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = `${d} (${img.wd})`;
    dateSel.appendChild(opt);
  }
  dateSel.value = curDate;
  dateSel.addEventListener("change", () => { curDate = dateSel.value; render(); });
  $("prev").addEventListener("click", () => step(1));   // dates는 최신순 → prev=인덱스+1
  $("next").addEventListener("click", () => step(-1));
  $("tabs").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    curDev = b.dataset.dev;
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  $("lb-close").addEventListener("click", closeLB);
  $("lb-prev").addEventListener("click", () => moveLB(-1));
  $("lb-next").addEventListener("click", () => moveLB(1));
  $("lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closeLB(); });
  document.addEventListener("keydown", e => {
    if (!$("lightbox").classList.contains("on")) return;
    if (e.key === "Escape") closeLB();
    if (e.key === "ArrowLeft") moveLB(-1);
    if (e.key === "ArrowRight") moveLB(1);
  });
  $("footer").textContent = `마지막 갱신: ${DATA.generated} · 총 ${DATA.images.length}장 (${dates.length}일치)`;
  render();
}

function step(delta) {
  const i = dates.indexOf(curDate) + delta;
  if (i < 0 || i >= dates.length) return;
  curDate = dates[i];
  dateSel.value = curDate;
  render();
}

function render() {
  const main = $("main");
  main.innerHTML = "";
  visible = [];
  const i0 = dates.indexOf(curDate);
  $("prev").disabled = i0 >= dates.length - 1;
  $("next").disabled = i0 <= 0;

  const dayImgs = DATA.images.filter(x => x.date === curDate);
  const devs = DATA.devices.filter(d => curDev === "전체" || d.name === curDev);

  for (const dev of devs) {
    const imgs = dayImgs.filter(x => x.dev === dev.name);
    const sec = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.innerHTML = `${dev.name === "PC" ? "🖥️ PC (naver.com)" : "📱 모바일 (m.naver.com)"} <span class="chip">${imgs.length}장</span>`;
    sec.appendChild(h2);

    if (!imgs.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "이 날짜에 캡처가 없습니다.";
      sec.appendChild(p);
      main.appendChild(sec);
      continue;
    }

    const byKey = {};
    for (const x of imgs) byKey[`${x.slot}|${x.h}`] = x;

    let html = `<div class="tablewrap"><table><thead><tr><th class="slotcol">지면</th>`;
    for (const h of HOURS) html += `<th>${hourLabel(h)}</th>`;
    html += `</tr></thead><tbody>`;
    for (const slot of dev.slots) {
      html += `<tr><th>${slot.n}${typeChip(slot.t)}</th>`;
      for (const h of HOURS) {
        const x = byKey[`${slot.n}|${h}`];
        if (x) {
          const vi = visible.length;
          visible.push(x);
          let cap = "";
          if (x.adv) {
            cap = `<div class="cap"><b>${x.adv}</b>${x.cat ? `<span class="pill">${x.cat}</span>` : ""}</div>`;
          }
          html += `<td><img class="thumb" loading="lazy" src="${encodeURI(x.p)}" data-vi="${vi}" alt="${slot.n} ${x.date} ${hourLabel(x.h)}">${cap}</td>`;
        } else {
          html += `<td class="miss"></td>`;
        }
      }
      html += `</tr>`;
    }
    html += `</tbody></table></div>`;
    sec.insertAdjacentHTML("beforeend", html);
    main.appendChild(sec);
  }

  if (!dayImgs.length) {
    main.innerHTML = `<p class="empty">표시할 캡처가 없습니다.</p>`;
  }
  main.querySelectorAll("img[data-vi]").forEach(img => {
    img.addEventListener("click", () => openLB(+img.dataset.vi));
  });
}

function openLB(i) {
  lbIdx = i;
  const x = visible[i];
  $("lb-img").src = encodeURI(x.p);
  let cap = `[${x.dev}] ${x.slot} — ${x.date}(${x.wd}) ${hourLabel(x.h)}  (${i + 1}/${visible.length})`;
  if (x.adv) cap += `\n${x.adv}${x.note ? " · " + x.note : ""}`;
  $("lb-caption").textContent = cap;
  $("lightbox").classList.add("on");
}
function moveLB(d) {
  const i = lbIdx + d;
  if (i < 0 || i >= visible.length) return;
  openLB(i);
}
function closeLB() { $("lightbox").classList.remove("on"); }

init();
</script>
