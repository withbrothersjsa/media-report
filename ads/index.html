<style>

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13161a; --surface: #1c2127; --border: #313842;
      --ink: #e7eaee; --ink2: #a2abb6; --ink3: #6d7683;
      --accent: #6ea3f5; --accent-bg: #1f2c44;

  * { box-sizing: border-box; margin: 0; padding: 0; }

    background: var(--bg); color: var(--ink);

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 24px;

  .header-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 17px; font-weight: 700; white-space: nowrap; }
  h1 small { font-weight: 400; color: var(--ink3); font-size: 12.5px; margin-left: 8px; }
  .datenav { display: flex; align-items: center; gap: 6px; }
  .datenav button, .tabs button {
    background: var(--surface); border: 1px solid var(--border); color: var(--ink);
    border-radius: 8px; padding: 7px 13px; cursor: pointer; font-size: 15px;
  }
  .datenav button:hover, .tabs button:hover { border-color: var(--accent); }
  .datenav button:disabled { opacity: .35; cursor: default; border-color: var(--border); }
  .datenav select {
    background: var(--surface); border: 1px solid var(--border); color: var(--ink);

  .tabs { display: flex; gap: 6px; }
  .tabs button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .stats { display: flex; gap: 8px; margin-left: auto; }
  .stat {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 14px; text-align: center; min-width: 76px;
  }
  .stat b { display: block; font-size: 17px; }
  .stat span { font-size: 11px; color: var(--ink3); }
  main { padding: 24px; max-width: 1900px; margin: 0 auto; }
  section { margin-bottom: 32px; }
  section h2 {
    font-size: 15px; font-weight: 700; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  section h2 .chip {
    font-size: 11px; font-weight: 500; color: var(--ink3);
    border: 1px solid var(--border); border-radius: 20px; padding: 1px 9px;
  }
  .tablewrap {
    overflow-x: auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px;
  }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid var(--border); padding: 12px 12px; vertical-align: top; }
  thead th {
    font-size: 14px; color: var(--ink); font-weight: 700; text-align: center;
    background: var(--surface); position: sticky; top: 0; padding: 10px 12px;
    border-bottom: 2px solid var(--border);
  }
  thead th.slotcol { text-align: left; }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom: none; }
  tbody th {
    font-size: 14.5px; font-weight: 700; text-align: left; white-space: nowrap;
    position: sticky; left: 0; background: var(--surface); min-width: 128px;
    border-right: 1px solid var(--border); vertical-align: middle;
  }
  tbody th .type { display: block; margin-top: 4px; font-size: 10.5px; font-weight: 600; }
  .tp-b { color: var(--accent); }
  .tp-p { color: var(--good); }
  .tp-e { color: var(--ink3); }
  td { text-align: center; min-width: 170px; }
  td .thumb {
    max-height: 150px; max-width: 230px; width: auto; border-radius: 8px;
    border: 1px solid var(--border); cursor: zoom-in; display: block; margin: 0 auto;
    background: var(--miss);
  }
  td .thumb:hover { border-color: var(--accent); }
  .cap {
    margin: 8px auto 0; max-width: 230px; line-height: 1.35;
  }
  .cap b { font-size: 13.5px; font-weight: 700; color: var(--ink); display: block; }
  .cap .pill {
    display: inline-block; margin-top: 4px; font-size: 11px; color: var(--ink2);
    background: var(--pill); border-radius: 20px; padding: 1px 9px;
  }
  td.miss { color: var(--ink3); font-size: 12px; background: var(--miss); vertical-align: middle; }
  .empty { color: var(--ink3); text-align: center; padding: 60px 0; }
  footer { color: var(--ink3); font-size: 12px; text-align: center; padding: 12px 0 26px; }
  /* 라이트박스 */
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(10,12,16,.9); flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
  }
  #lightbox.on { display: flex; }
  #lightbox img {
    max-width: 92vw; max-height: 80vh; border-radius: 8px; background: #fff;
  }
  #lb-caption { color: #dbe0e6; font-size: 14px; white-space: pre-line; text-align: center; max-width: 80vw; }
  #lightbox .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,.12); color: #fff; border: none; border-radius: 50%;
    width: 46px; height: 46px; font-size: 20px; cursor: pointer;
  }
  #lightbox .lb-nav:hover { background: rgba(255,255,255,.25); }
  #lb-prev { left: 22px; } #lb-next { right: 22px; }
  #lb-close {
    position: absolute; top: 16px; right: 22px; background: none; border: none;
    color: #fff; font-size: 27px; cursor: pointer;
  }
</style>

어", "cat": "건강/구강"}, {"dev": "모바일", "slot": "홈피드4", "date": "2026-07-13", "wd": "월", "h": "16", "min": "09", "p": "img/2026-07-13_모바일_홈피드4_16.jpg", "adv": "제거죠스(JaggerJoss)", "note": "하수구 악취 원인 제거 — 효소 탈취제 1만원대", "cat": "리빙/생활"}, {"dev": "모바일", "slot": "홈피드프로모션", "date": "2026-07-13", "wd": "월", "h": "16", "min": "09", "p": "img/2026-07-13_모바일_홈피드프로모션_16.jpg", "adv": "네이버(자체)", "note": "빙수 도장깨기의 계절 — 내 주변 맛집 리스트", "cat": "플랫폼/자체"}]};

const dates = [...new Set(DATA.images.map(x => x.date))].sort().reverse();
let curDate = dates[0] || null;
let curDev = "전체";
let visible = [];   // 현재 화면 이미지 목록(라이트박스 순회용)
let lbIdx = -1;

const $ = id => document.getElementById(id);
const dateSel = $("dateSel");

// "16" → "오후 4시" (정시 통일 표기)
function hourLabel(h) {
  const n = parseInt(h, 10);
  if (n === 0) return "자정 12시";
  if (n < 12) return `오전 ${n}시`;
  if (n === 12) return "낮 12시";
  return `오후 ${n - 12}시`;
}

function typeChip(t) {
  if (!t) return "";
  const cls = t.startsWith("성과형") ? "tp-p" : t.startsWith("보장형") ? "tp-b" : "tp-e";
  return `<span class="type ${cls}">${t}</span>`;
}

function init() {
  const hm = location.hash.match(/\d{4}-\d{2}-\d{2}/);
  if (hm && dates.includes(hm[0])) curDate = hm[0];
  for (const d of dates) {
    const img = DATA.images.find(x => x.date === d);
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = `${d} (${img.wd})`;
    dateSel.appendChild(opt);
  }
  dateSel.value = curDate;
  dateSel.addEventListener("change", () => { curDate = dateSel.value; render(); });
  $("prev").addEventListener("click", () => step(1));   // dates는 최신순 → prev=인덱스+1
  $("next").addEventListener("click", () => step(-1));
  $("tabs").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    curDev = b.dataset.dev;
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  $("lb-close").addEventListener("click", closeLB);
  $("lb-prev").addEventListener("click", () => moveLB(-1));
  $("lb-next").addEventListener("click", () => moveLB(1));
  $("lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closeLB(); });
  document.addEventListener("keydown", e => {
    if (!$("lightbox").classList.contains("on")) return;
    if (e.key === "Escape") closeLB();
    if (e.key === "ArrowLeft") moveLB(-1);
    if (e.key === "ArrowRight") moveLB(1);
  });
  $("footer").textContent = `마지막 갱신: ${DATA.generated} · 총 ${DATA.images.length}장 (${dates.length}일치)`;
  render();
}

function step(delta) {
  const i = dates.indexOf(curDate) + delta;
  if (i < 0 || i >= dates.length) return;
  curDate = dates[i];
  dateSel.value = curDate;
  render();
}

function render() {
  const main = $("main");
  main.innerHTML = "";
  visible = [];
  const i0 = dates.indexOf(curDate);
  $("prev").disabled = i0 >= dates.length - 1;
  $("next").disabled = i0 <= 0;

  const dayImgs = DATA.images.filter(x => x.date === curDate);
  const devs = DATA.devices.filter(d => curDev === "전체" || d.name === curDev);
  let nImg = 0, nMiss = 0;
  const runHours = new Set(dayImgs.map(x => x.h));

  for (const dev of devs) {
    const imgs = dayImgs.filter(x => x.dev === dev.name);
    const hours = [...new Set(imgs.map(x => x.h))].sort();
    const sec = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.innerHTML = `${dev.name === "PC" ? "🖥️ PC (naver.com)" : "📱 모바일 (m.naver.com)"} <span class="chip">${imgs.length}장</span>`;
    sec.appendChild(h2);

    if (!hours.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "이 날짜에 캡처가 없습니다.";
      sec.appendChild(p);
      main.appendChild(sec);
      continue;
    }

    const byKey = {};
    for (const x of imgs) byKey[`${x.slot}|${x.h}`] = x;

    let html = `<div class="tablewrap"><table><thead><tr><th class="slotcol">지면</th>`;
    for (const h of hours) html += `<th>${hourLabel(h)}</th>`;
    html += `</tr></thead><tbody>`;
    for (const slot of dev.slots) {
      html += `<tr><th>${slot.n}${typeChip(slot.t)}</th>`;
      for (const h of hours) {
        const x = byKey[`${slot.n}|${h}`];
        if (x) {
          const vi = visible.length;
          visible.push(x);
          nImg++;
          let cap = "";
          if (x.adv) {
            cap = `<div class="cap"><b>${x.adv}</b>${x.cat ? `<span class="pill">${x.cat}</span>` : ""}</div>`;
          }
          html += `<td><img class="thumb" loading="lazy" src="${encodeURI(x.p)}" data-vi="${vi}" alt="${slot.n} ${x.date} ${hourLabel(x.h)}">${cap}</td>`;
        } else {
          nMiss++;
          html += `<td class="miss">캡처 없음</td>`;
        }
      }
      html += `</tr>`;
    }
    html += `</tbody></table></div>`;
    sec.insertAdjacentHTML("beforeend", html);
    main.appendChild(sec);
  }

  if (!dayImgs.length) {
    main.innerHTML = `<p class="empty">표시할 캡처가 없습니다.</p>`;
  }
  $("st-img").textContent = nImg;
  $("st-run").textContent = runHours.size;
  $("st-miss").textContent = nMiss;

  main.querySelectorAll("img[data-vi]").forEach(img => {
    img.addEventListener("click", () => openLB(+img.dataset.vi));
  });
}

function openLB(i) {
  lbIdx = i;
  const x = visible[i];
  $("lb-img").src = encodeURI(x.p);
  let cap = `[${x.dev}] ${x.slot} — ${x.date}(${x.wd}) ${hourLabel(x.h)}  (${i + 1}/${visible.length})`;
  if (x.adv) cap += `\n${x.adv}${x.note ? " · " + x.note : ""}`;
  $("lb-caption").textContent = cap;
  $("lightbox").classList.add("on");
}
function moveLB(d) {
  const i = lbIdx + d;
  if (i < 0 || i >= visible.length) return;
  openLB(i);
}
function closeLB() { $("lightbox").classList.remove("on"); }

init();
</script>
